<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="card-book-quality — an arithmetic split of card write-offs into balance and loss-ratio contributions">
  <rect width="1280" height="320" fill="#14293D"/>
  <title>card-book-quality — an arithmetic split of card write-offs into balance and loss-ratio contributions</title>
  <text x="72" y="118" font-family="Georgia, 'Source Serif 4', serif" font-size="58" fill="#F3F0EA">card-book-quality</text>
  <rect x="72" y="146" width="430" height="4" fill="#D97E4F"/>
  <text x="72" y="196" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#A9B6C1">In 2025, credit-card write-offs rose S$96.5M — did</text>
  <text x="72" y="222" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#A9B6C1">balances grow, or did the loss ratio increase? A</text>
  <text x="72" y="248" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#A9B6C1">same-money split: <tspan fill="#4C93B5">●</tspan> balance +63.9 vs <tspan fill="#D97E4F">●</tspan> ratio +32.6,</text>
  <text x="72" y="274" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#A9B6C1">all issuers in Singapore, not one bank.</text>
  <text x="72" y="306" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8B98A5">Write-offs S$M · balance = rollover · ratio = loss proxy</text>
  <line x1="854" y1="91.1" x2="880" y2="91.1" stroke="#2C4358" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="934" y1="66.5" x2="960" y2="66.5" stroke="#2C4358" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="1014" y1="54" x2="1040" y2="54" stroke="#2C4358" stroke-width="3" stroke-dasharray="6 5"/>
  <rect x="800" y="91.1" width="54" height="162.9" fill="#8B98A5"/>
  <rect x="880" y="66.5" width="54" height="24.6" fill="#4C93B5"/>
  <rect x="960" y="54" width="54" height="12.5" fill="#D97E4F"/>
  <rect x="1040" y="54" width="54" height="200" fill="#8B98A5"/>
  <text x="827" y="83" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#A9B6C1">423.2</text>
  <text x="907" y="58" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#4C93B5">+63.9</text>
  <text x="987" y="46" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#D97E4F">+32.6</text>
  <text x="1067" y="46" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#A9B6C1">519.7</text>
  <text x="827" y="276" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8B98A5">2024</text>
  <text x="907" y="276" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8B98A5">balance</text>
  <text x="987" y="276" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8B98A5">ratio</text>
  <text x="1067" y="276" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8B98A5">2025</text>
  <text x="1208" y="306" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#D97E4F">Data: MAS via data.gov.sg · Singapore Open Data Licence</text>
