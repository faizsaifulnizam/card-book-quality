name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    name: pipeline + checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run the validated snapshot pipeline (no network)
        run: python src/run_all.py

      - name: Calculation, spreadsheet structure, presentation and failure regressions
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tests/test_bridge.py

      - name: Repeat generation and compare artifact SHA-256 hashes
        run: python tests/verify_reproducibility.py

      - name: Committed artifacts & receipts (incl. locked headline numbers)
        run: python tests/smoke_test.py

      - name: Regenerated CSVs match the committed ones (byte-for-byte)
        run: git diff --exit-code -- 'outputs/*.csv'
